<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plataforma de Cursos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="encabezado">
    <h1>Plataforma de Cursos</h1>
    <button type="button" id="btn-nuevo" class="btn btn-primario">+ Nuevo curso</button>
</header>

<main>
    <!-- Filtros -->
    <section class="panel">
        <form id="form-filtros" class="filtros">
            <div class="campo">
                <label for="filtro-titulo">Nombre o ID del curso</label>
                <input
                        type="search"
                        id="filtro-titulo"
                        placeholder="Ej. Java básico o 67a1b2c3d4e5f67890123456"
                >
            </div>
            <div class="campo">
                <label for="filtro-categoria">Categoría</label>
                <select id="filtro-categoria">
                    <option value="">Todas</option>
                </select>
            </div>
            <div class="campo">
                <label for="filtro-nivel">Nivel</label>
                <select id="filtro-nivel">
                    <option value="">Todos</option>
                    <option value="Principiante">Principiante</option>
                    <option value="Intermedio">Intermedio</option>
                    <option value="Avanzado">Avanzado</option>
                </select>
            </div>
            <div class="acciones-filtro">
                <button type="submit" class="btn btn-primario">Filtrar</button>
                <button type="button" id="btn-limpiar" class="btn">Limpiar</button>
            </div>
        </form>
    </section>

    <!-- Mensajes de éxito o error -->
    <div id="mensaje" class="mensaje" role="status" aria-live="polite" hidden></div>

    <!-- Tabla de cursos -->
    <section class="panel">
        <p id="contador" class="contador"></p>
        <div class="tabla-contenedor">
            <table>
                <thead>
                <tr>
                    <th>Título</th>
                    <th>Categoría</th>
                    <th>Nivel</th>
                    <th>Duración</th>
                    <th>Precio</th>
                    <th>Calif.</th>
                    <th>Inscritos</th>
                    <th>Estado</th>
                    <th>Instructor</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody id="tabla-cursos"></tbody>
            </table>
        </div>
    </section>
</main>

<!-- Formulario de alta y edición -->
<dialog id="dialogo-curso" aria-labelledby="titulo-dialogo">
    <form id="form-curso" class="dialogo-contenido">
        <h2 id="titulo-dialogo">Nuevo curso</h2>

        <div id="errores-form" class="errores" role="alert" hidden></div>

        <div class="rejilla">
            <div class="campo campo-ancho">
                <label for="campo-titulo">Título</label>
                <input type="text" id="campo-titulo" maxlength="120" required>
            </div>

            <div class="campo">
                <label for="campo-categoria">Categoría</label>
                <input type="text" id="campo-categoria" list="lista-categorias" required>
                <datalist id="lista-categorias"></datalist>
            </div>

            <div class="campo">
                <label for="campo-nivel">Nivel</label>
                <select id="campo-nivel" required>
                    <option value="" disabled selected>Selecciona un nivel</option>
                    <option value="Principiante">Principiante</option>
                    <option value="Intermedio">Intermedio</option>
                    <option value="Avanzado">Avanzado</option>
                </select>
            </div>

            <div class="campo">
                <label for="campo-duracion">Duración (horas)</label>
                <input type="number" id="campo-duracion" min="1" step="1" required>
            </div>

            <div class="campo">
                <label for="campo-precio">Precio (MXN)</label>
                <input type="number" id="campo-precio" min="0" step="0.01" required>
            </div>

            <div class="campo">
                <label for="campo-calificacion">Calificación (0 a 5)</label>
                <input type="number" id="campo-calificacion" min="0" max="5" step="0.1" required>
            </div>

            <div class="campo">
                <label for="campo-inscritos">Estudiantes inscritos</label>
                <input type="number" id="campo-inscritos" min="0" step="1" required>
            </div>

            <div class="campo">
                <label for="campo-instructor-nombre">Nombre del instructor</label>
                <input type="text" id="campo-instructor-nombre" required>
            </div>

            <div class="campo">
                <label for="campo-instructor-correo">Correo del instructor</label>
                <input type="email" id="campo-instructor-correo" required>
            </div>

            <div class="campo campo-ancho">
                <label for="campo-etiquetas">Etiquetas (separadas por comas)</label>
                <input type="text" id="campo-etiquetas" placeholder="python, programación">
            </div>

            <div class="campo campo-ancho campo-check">
                <input type="checkbox" id="campo-activo" checked>
                <label for="campo-activo">Curso activo</label>
            </div>
        </div>

        <div class="dialogo-acciones">
            <button type="button" id="btn-cancelar" class="btn">Cancelar</button>
            <button type="submit" id="btn-guardar" class="btn btn-primario">Guardar</button>
        </div>
    </form>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
